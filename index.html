<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>早押しクイズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#182437;--line:#2d3d55;--text:#f4f7fb;--muted:#a8b5c7;--accent:#6ee7b7;--gold:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#ff5370,#ffad42,#ffec70,#52d68a,#44b9e8,#9b72f4,#ff6da7);background-size:400% 400%;animation:rainbow 22s ease infinite;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}@keyframes rainbow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}main{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:clamp(26px,6vw,40px);margin:0;letter-spacing:.04em}.badge{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px}.card{background:rgba(24,36,55,.92);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 14px 40px #0002}.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1928;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent)}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .08s,filter .15s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:#08251a}.secondary{background:#31425c;color:var(--text)}.danger{background:#6b293a;color:#ffe7eb}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.roomcode{font:700 20px ui-monospace,monospace;color:var(--gold);letter-spacing:.12em}.hidden{display:none!important}.status{color:var(--muted);font-size:14px;min-height:23px}.question{font-size:clamp(22px,5vw,34px);font-weight:750;line-height:1.35;min-height:90px;display:grid;place-items:center;text-align:center}.buzzer{width:100%;height:168px;margin:18px 0;padding:12px 12px 25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;border:7px solid #ffd95a;border-radius:50%;background:radial-gradient(ellipse at 50% 28%,#ffb6a1 0%,#ff334f 23%,#d90030 58%,#79001c 100%);color:#fffbe8;box-shadow:inset 0 7px 10px #ffffff70,inset 0 -12px 18px #580016,0 8px 0 #6b3a08,0 0 20px #ff345caa;text-shadow:0 3px 2px #71001e;letter-spacing:.14em;animation:slotGlow 1.4s ease-in-out infinite alternate}.buzzer span{font-size:clamp(36px,9vw,58px);font-weight:1000;line-height:1}.buzzer small{font-size:12px;letter-spacing:.12em}.buzzer:before{content:"";position:absolute;inset:7px;border:2px dashed #fff6a6;border-radius:50%;pointer-events:none}.buzzer:active{box-shadow:inset 0 12px 22px #4e001d,0 2px 0 #6b3a08,0 0 30px #ffcf3f;transform:translateY(5px) scale(.985)}.buzzer:disabled{animation:none;filter:saturate(.55);box-shadow:inset 0 7px 10px #ffffff30,inset 0 -12px 18px #580016,0 6px 0 #6b3a08;opacity:.72}@keyframes slotGlow{from{filter:brightness(.96)}to{filter:brightness(1.14)}}.winner{font-size:clamp(24px,5vw,34px);font-weight:800;text-align:center;color:var(--gold);padding:14px 0}.queue{background:#101a29;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;color:var(--muted);font-size:14px}.queue strong{color:var(--text)}.players{display:grid;gap:8px}.scoreCard{position:sticky;top:8px;z-index:5;max-height:42vh;overflow:auto;background:rgba(24,36,55,.97)}.player{display:flex;align-items:center;justify-content:space-between;background:#101a29;border:1px solid var(--line);padding:11px 13px;border-radius:12px}.small{font-size:13px;color:var(--muted)}.score{display:flex;align-items:center;gap:8px}.score button{padding:4px 10px}.pill{font-size:12px;border-radius:999px;padding:3px 8px;background:#293c54;color:#c9d8e9}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#2b281e;color:#f7e6b2;font-size:13px;border-radius:4px 10px 10px 4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.hostOnly,.playerOnly{display:none}.as-host .hostOnly{display:block}.as-player .playerOnly{display:block}@media(max-width:650px){.setup{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:17px}main{padding:18px 12px 40px}.top{align-items:flex-start}}
</style></head>
<body><main id="app">
<div class="top"><h1>⚡ 早押しクイズ</h1><span class="badge" id="connectionBadge">未接続</span></div>
<section class="card" id="joinCard"><div class="setup">
<div><label class="label" for="nickname">あなたの名前</label><input id="nickname" maxlength="16" placeholder="例：あおい" autocomplete="nickname"></div>
<div><label class="label" for="roomInput">ルームコード（参加する人）</label><input id="roomInput" maxlength="12" placeholder="例：QUIZ7" autocapitalize="characters"></div>
<div><button class="primary" id="joinBtn">ルームに参加</button></div>
<div><button class="secondary" id="hostBtn">新しいルームを作る</button></div>
<div class="full small">司会者がルームを作成し、表示されたコードを参加者に共有してください。</div></div></section>
<div id="game" class="hidden">
<section class="card"><div class="row"><div>ルーム <span class="roomcode" id="roomLabel"></span></div><span class="pill" id="roleLabel"></span></div><p class="status" id="status"></p>
<div class="hostOnly"><div class="notice">この画面を開いたままにしてください。参加者も同じページを開き、ルームコードを入力します。</div></div></section>
<section class="card"><div class="question" id="question">問題を出題してください</div><div class="winner" id="winner"></div><div class="queue" id="buzzQueue">早押し順：まだありません</div>
<div class="playerOnly"><button class="buzzer" id="buzzBtn" disabled><span>PUSH!</span><small>ひと押しで勝負！</small></button><div class="small" style="text-align:center">回答権があると思ったら押してください</div></div>
<div class="hostOnly"><div class="actions"><button class="primary" id="askBtn">早押し開始（次の問題）</button><button class="primary" id="correctBtn">✅ 正解</button><button class="danger" id="wrongBtn">❌ 不正解</button></div></div>
</section>
<section class="card scoreCard"><div class="row" style="justify-content:space-between;margin-bottom:12px"><strong>参加者・得点</strong><span class="small" id="playerCount"></span></div><div class="players" id="players"></div></section>
<div class="actions"><button class="danger" id="leaveBtn">退出</button><button class="secondary hostOnly" id="copyBtn">参加リンクをコピー</button></div></div>
<p class="foot">通信にはPeerJSの公開シグナリングサーバーを利用します。ルーム内の通信はブラウザ同士で行います。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), app=$('app');let peer=null,host=false,room='',myId='',hostConn=null,connections=new Map(),players=new Map(),open=false,question='',winnerId=null,questionNo=0,locked=new Set(),buzzOrder=[];
const randomCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
function setStatus(s){$('status').textContent=s}function playTone(kind='buzz'){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain(),good=kind==='good';osc.type=good?'sine':'triangle';osc.frequency.setValueAtTime(good?660:330,ctx.currentTime);osc.frequency.setValueAtTime(good?990:220,ctx.currentTime+0.1);gain.gain.setValueAtTime(0.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+0.015);gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.34);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.35);osc.onended=()=>ctx.close()}catch(e){}}function connected(){ $('connectionBadge').textContent='接続中';$('connectionBadge').style.color='var(--accent)'}
function render(){ $('question').textContent=question|| (host?'早押しクイズ':'司会者の開始を待っています');$('winner').textContent=winnerId?(players.get(winnerId)?.name||'参加者')+' さんの回答です':'';$('buzzQueue').textContent=buzzOrder.length?'早押し順：'+buzzOrder.map((id,i)=>`${i+1}位 ${players.get(id)?.name||'参加者'}`).join('　›　'):'早押し順：まだありません';$('buzzBtn').disabled=host||!open||buzzOrder.includes(myId)||!hostConn||locked.has(myId); $('playerCount').textContent=players.size+'人';const box=$('players');box.replaceChildren();for(const [id,p] of players){const row=document.createElement('div');row.className='player';const name=document.createElement('span');name.textContent=p.name+(id===myId?'（あなた）':'');const sc=document.createElement('div');sc.className='score';const pts=document.createElement('strong');pts.textContent=p.score+'点';sc.append(pts);if(host){for(const [label,delta]of[['−1',-1],['＋1点',1]]){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=()=>{p.score=Math.max(0,p.score+delta);if(delta>0)playTone('good');render();broadcast({type:'scores',players:serializePlayers(),sound:true,delta})};sc.append(b)}}row.append(name,sc);box.append(row)}$('roomLabel').textContent=room;$('roleLabel').textContent=host?'司会者':'参加者';}
function serializePlayers(){return [...players].map(([id,p])=>({id,name:p.name,score:p.score}))}
function broadcast(msg){for(const c of connections.values())if(c.open)c.send(msg)}function stateMsg(){return{type:'state',players:serializePlayers(),open,question,winnerId,questionNo,locked:[...locked],buzzOrder}}
function receive(msg,conn){if(!msg||typeof msg!=='object')return;if(host){if(msg.type==='buzz'&&open&&!locked.has(conn.peer)&&!buzzOrder.includes(conn.peer)&&players.has(conn.peer)){buzzOrder.push(conn.peer);const first=buzzOrder.length===1;if(first){winnerId=conn.peer;playTone();setStatus('回答権：'+players.get(conn.peer).name+' さん')}broadcast({type:'buzzOrder',buzzOrder,winnerId});render()}else if(msg.type==='hello'){const pname=String(msg.name||'参加者').slice(0,16);players.set(conn.peer,{name:pname,score:0});connections.set(conn.peer,conn);conn.send(stateMsg());broadcast({type:'players',players:serializePlayers()});render();setStatus(pname+' さんが参加しました')}}else{if(msg.type==='state'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));open=msg.open;question=msg.question;winnerId=msg.winnerId;questionNo=msg.questionNo;locked=new Set(msg.locked||[]);buzzOrder=msg.buzzOrder||[];render();setStatus('ルームに参加しました')}if(msg.type==='players'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));render()}if(msg.type==='question'){question=msg.question;questionNo=msg.questionNo;winnerId=null;locked.clear();buzzOrder=[];open=false;render();setStatus('問題が出ました')}if(msg.type==='open'){open=true;winnerId=null;locked.clear();buzzOrder=[];render();setStatus('早押し受付中！')}if(msg.type==='lock'){open=false;render();setStatus('早押しを一時停止しました')}if(msg.type==='buzzOrder'){buzzOrder=msg.buzzOrder||[];winnerId=msg.winnerId;if(buzzOrder.length===1)playTone();render()}if(msg.type==='winner'){winnerId=msg.winnerId;open=false;playTone();render();setStatus('回答権：'+msg.name+' さん')}if(msg.type==='wrong'){playTone('bad');if(msg.id)locked.add(msg.id);buzzOrder=msg.buzzOrder||buzzOrder;winnerId=msg.winnerId||null;open=msg.open;render();setStatus(msg.name+' さん不正解。'+(winnerId?(players.get(winnerId)?.name||'次の人')+' さんの回答です':'もう一度早押しできます'))}if(msg.type==='correct'){playTone('good');winnerId=msg.id;open=false;render();setStatus(msg.name+' さん正解！ +1点')}if(msg.type==='next'){question='';winnerId=null;locked.clear();buzzOrder=[];open=false;questionNo=msg.questionNo;render();setStatus('次の問題を待っています')}if(msg.type==='scores'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));if(msg.sound)playTone(msg.delta>0?'good':'bad');render()}}}
function setupConn(c){c.on('data',m=>receive(m,c));c.on('close',()=>{if(host){connections.delete(c.peer);players.delete(c.peer);broadcast({type:'players',players:serializePlayers()});render();setStatus('参加者が退出しました')}else{setStatus('司会者との接続が切れました')}});c.on('error',()=>setStatus('通信に問題が発生しました。再接続してください'))}
function startHost(){room=randomCode();host=true;myId='host';app.className='as-host';$('joinCard').classList.add('hidden');$('game').classList.remove('hidden');$('copyBtn').style.display='';$('leaveBtn').style.display='';players.clear();peer=new Peer('hayoshi-'+room.toLowerCase(),{debug:0});setStatus('ルームを準備しています…');peer.on('open',()=>{connected();setStatus('参加者を待っています。ルームコードを共有してください')});peer.on('connection',c=>{setupConn(c)});peer.on('error',e=>{setStatus(e.type==='unavailable-id'?'このルームコードは使用中です。退出して作り直してください':'接続エラー：'+e.type)});render()}
function join(){room=$('roomInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(room.length<4){alert('ルームコードを4文字以上で入力してください');return}const name=$('nickname').value.trim().slice(0,16)||'参加者';host=false;app.className='as-player';$('joinCard').classList.add('hidden');$('game').classList.remove('hidden');peer=new Peer(undefined,{debug:0});setStatus('司会者に接続しています…');peer.on('open',id=>{myId=id;hostConn=peer.connect('hayoshi-'+room.toLowerCase(),{reliable:true});setupConn(hostConn);hostConn.on('open',()=>{connected();hostConn.send({type:'hello',name})})});peer.on('error',e=>setStatus(e.type==='peer-unavailable'?'司会者が見つかりません。ルームコードを確認してください':'接続エラー：'+e.type));render()}
$('hostBtn').onclick=startHost;$('joinBtn').onclick=join;$('buzzBtn').onclick=()=>{if(open&&!buzzOrder.includes(myId)&&!locked.has(myId)){hostConn.send({type:'buzz',at:performance.now()})}};$('askBtn').onclick=()=>{question='';questionNo++;winnerId=null;locked.clear();buzzOrder=[];open=true;render();setStatus('早押し受付中！');broadcast({type:'question',question,questionNo});broadcast({type:'open'})};$('correctBtn').onclick=()=>{if(!winnerId){setStatus('先に参加者が早押ししてください');return}playTone('good');const id=winnerId,p=players.get(id);if(p)p.score++;open=false;broadcast({type:'correct',id,name:p?.name||'参加者'});broadcast({type:'scores',players:serializePlayers()});render();setStatus((p?.name||'参加者')+' さん正解！ +1点')};$('wrongBtn').onclick=()=>{if(!winnerId){setStatus('先に参加者が早押ししてください');return}playTone('bad');const id=winnerId,name=players.get(id)?.name||'参加者';locked.add(id);winnerId=buzzOrder.find(pid=>!locked.has(pid))||null;open=!winnerId;broadcast({type:'wrong',id,name,winnerId,buzzOrder,open});render();setStatus(name+' さん不正解。'+(winnerId?(players.get(winnerId)?.name||'次の人')+' さんの回答です':'もう一度早押しできます'))};$('copyBtn').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('room',room);await navigator.clipboard.writeText(url.href);$('roomInput').value=room;setStatus('参加リンクをコピーしました')};$('leaveBtn').onclick=()=>{if(peer)peer.destroy();location.reload()};const q=new URLSearchParams(location.search).get('room');if(q){$('roomInput').value=q.toUpperCase();$('nickname').focus()}
})();
</script></body></html>
