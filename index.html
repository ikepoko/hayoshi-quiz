<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>早押しクイズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#182437;--line:#2d3d55;--text:#f4f7fb;--muted:#a8b5c7;--accent:#6ee7b7;--gold:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#213451,var(--bg) 65%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:clamp(26px,6vw,40px);margin:0;letter-spacing:.04em}.badge{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px}.card{background:rgba(24,36,55,.92);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 14px 40px #0002}.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1928;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent)}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .08s,filter .15s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:#08251a}.secondary{background:#31425c;color:var(--text)}.danger{background:#6b293a;color:#ffe7eb}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.roomcode{font:700 20px ui-monospace,monospace;color:var(--gold);letter-spacing:.12em}.hidden{display:none!important}.status{color:var(--muted);font-size:14px;min-height:23px}.question{font-size:clamp(22px,5vw,34px);font-weight:750;line-height:1.35;min-height:90px;display:grid;place-items:center;text-align:center}.buzzer{width:100%;padding:24px;font-size:clamp(24px,6vw,40px);background:linear-gradient(135deg,#f43f5e,#be123c);color:white;border-radius:18px;box-shadow:0 7px 0 #760d28;margin:14px 0}.buzzer:active{box-shadow:0 2px 0 #760d28;transform:translateY(4px)}.winner{font-size:clamp(24px,5vw,34px);font-weight:800;text-align:center;color:var(--gold);padding:14px 0}.players{display:grid;gap:8px}.player{display:flex;align-items:center;justify-content:space-between;background:#101a29;border:1px solid var(--line);padding:11px 13px;border-radius:12px}.small{font-size:13px;color:var(--muted)}.score{display:flex;align-items:center;gap:8px}.score button{padding:4px 10px}.pill{font-size:12px;border-radius:999px;padding:3px 8px;background:#293c54;color:#c9d8e9}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#2b281e;color:#f7e6b2;font-size:13px;border-radius:4px 10px 10px 4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.hostOnly,.playerOnly{display:none}.as-host .hostOnly{display:block}.as-player .playerOnly{display:block}@media(max-width:650px){.setup{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:17px}main{padding:18px 12px 40px}.top{align-items:flex-start}}
</style></head>
<body><main id="app">
<div class="top"><h1>⚡ 早押しクイズ</h1><span class="badge" id="connectionBadge">未接続</span></div>
<section class="card" id="joinCard"><div class="setup">
<div><label class="label" for="nickname">あなたの名前</label><input id="nickname" maxlength="16" placeholder="例：あおい" autocomplete="nickname"></div>
<div><label class="label" for="roomInput">ルームコード（参加する人）</label><input id="roomInput" maxlength="12" placeholder="例：QUIZ7" autocapitalize="characters"></div>
<div><button class="primary" id="joinBtn">ルームに参加</button></div>
<div><button class="secondary" id="hostBtn">新しいルームを作る</button></div>
<div class="full small">司会者がルームを作成し、表示されたコードを参加者に共有してください。</div></div></section>
<div id="game" class="hidden">
<section class="card"><div class="row"><div>ルーム <span class="roomcode" id="roomLabel"></span></div><span class="pill" id="roleLabel"></span></div><p class="status" id="status"></p>
<div class="hostOnly"><div class="notice">この画面を開いたままにしてください。参加者も同じページを開き、ルームコードを入力します。</div></div></section>
<section class="card"><div class="question" id="question">問題を出題してください</div><div class="winner" id="winner"></div>
<div class="playerOnly"><button class="buzzer" id="buzzBtn" disabled>押す！</button><div class="small" style="text-align:center">回答権があると思ったら押してください</div></div>
<div class="hostOnly"><label class="label" for="questionInput">問題文（司会者だけに表示され、送信後に全員へ共有）</label><input id="questionInput" placeholder="問題文を入力" maxlength="300"><div class="actions"><button class="primary" id="askBtn">問題を出す</button><button class="secondary" id="openBtn">早押し開始</button><button class="secondary" id="lockBtn">一時停止</button><button class="secondary" id="nextBtn">次の問題</button></div></div>
</section>
<section class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><strong>参加者・得点</strong><span class="small" id="playerCount"></span></div><div class="players" id="players"></div></section>
<div class="actions"><button class="danger" id="leaveBtn">退出</button><button class="secondary hostOnly" id="copyBtn">参加リンクをコピー</button></div></div>
<p class="foot">通信にはPeerJSの公開シグナリングサーバーを利用します。ルーム内の通信はブラウザ同士で行います。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), app=$('app');let peer=null,host=false,room='',myId='',hostConn=null,connections=new Map(),players=new Map(),open=false,question='',winnerId=null,questionNo=0;
const randomCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
function setStatus(s){$('status').textContent=s}function connected(){ $('connectionBadge').textContent='接続中';$('connectionBadge').style.color='var(--accent)'}
function render(){ $('question').textContent=question|| (host?'問題を出題してください':'司会者の出題を待っています');$('winner').textContent=winnerId?(players.get(winnerId)?.name||'参加者')+' さんが一番乗り！':'';$('buzzBtn').disabled=host||!open||!!winnerId||!hostConn; $('playerCount').textContent=players.size+'人';const box=$('players');box.replaceChildren();for(const [id,p] of players){const row=document.createElement('div');row.className='player';const name=document.createElement('span');name.textContent=p.name+(id===myId?'（あなた）':'');const sc=document.createElement('div');sc.className='score';const pts=document.createElement('strong');pts.textContent=p.score+'点';sc.append(pts);if(host){for(const [label,delta]of[['−',-1],['＋',1]]){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=()=>{p.score=Math.max(0,p.score+delta);render();sendAll({type:'scores',players:serializePlayers()})};sc.append(b)}}row.append(name,sc);box.append(row)}$('roomLabel').textContent=room;$('roleLabel').textContent=host?'司会者':'参加者';}
function serializePlayers(){return [...players].map(([id,p])=>({id,name:p.name,score:p.score}))}
function broadcast(msg){for(const c of connections.values())if(c.open)c.send(msg)}function stateMsg(){return{type:'state',players:serializePlayers(),open,question,winnerId,questionNo}}
function receive(msg,conn){if(!msg||typeof msg!=='object')return;if(host){if(msg.type==='buzz'&&open&&!winnerId&&players.has(conn.peer)){winnerId=conn.peer;open=false;const p=players.get(winnerId);setStatus('回答権：'+p.name+' さん');broadcast({type:'winner',winnerId,name:p.name});render()}else if(msg.type==='hello'){const pname=String(msg.name||'参加者').slice(0,16);players.set(conn.peer,{name:pname,score:0});connections.set(conn.peer,conn);conn.send(stateMsg());broadcast({type:'players',players:serializePlayers()});render();setStatus(pname+' さんが参加しました')}}else{if(msg.type==='state'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));open=msg.open;question=msg.question;winnerId=msg.winnerId;questionNo=msg.questionNo;render();setStatus('ルームに参加しました')}if(msg.type==='players'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));render()}if(msg.type==='question'){question=msg.question;questionNo=msg.questionNo;winnerId=null;open=false;render();setStatus('問題が出ました')}if(msg.type==='open'){open=true;winnerId=null;render();setStatus('早押し受付中！')}if(msg.type==='lock'){open=false;render();setStatus('早押しを一時停止しました')}if(msg.type==='winner'){winnerId=msg.winnerId;open=false;render();setStatus('回答権：'+msg.name+' さん')}if(msg.type==='next'){question='';winnerId=null;open=false;questionNo=msg.questionNo;render();setStatus('次の問題を待っています')}if(msg.type==='scores'){players=new Map(msg.players.map(p=>[p.id,{name:p.name,score:p.score}]));render()}}}
function setupConn(c){c.on('data',m=>receive(m,c));c.on('close',()=>{if(host){connections.delete(c.peer);players.delete(c.peer);broadcast({type:'players',players:serializePlayers()});render();setStatus('参加者が退出しました')}else{setStatus('司会者との接続が切れました')}});c.on('error',()=>setStatus('通信に問題が発生しました。再接続してください'))}
function startHost(){room=randomCode();host=true;myId='host';app.className='as-host';$('joinCard').classList.add('hidden');$('game').classList.remove('hidden');$('copyBtn').style.display='';$('leaveBtn').style.display='';players.clear();peer=new Peer('hayoshi-'+room.toLowerCase(),{debug:0});setStatus('ルームを準備しています…');peer.on('open',()=>{connected();setStatus('参加者を待っています。ルームコードを共有してください')});peer.on('connection',c=>{setupConn(c)});peer.on('error',e=>{setStatus(e.type==='unavailable-id'?'このルームコードは使用中です。退出して作り直してください':'接続エラー：'+e.type)});render()}
function join(){room=$('roomInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(room.length<4){alert('ルームコードを4文字以上で入力してください');return}const name=$('nickname').value.trim().slice(0,16)||'参加者';host=false;app.className='as-player';$('joinCard').classList.add('hidden');$('game').classList.remove('hidden');peer=new Peer(undefined,{debug:0});setStatus('司会者に接続しています…');peer.on('open',id=>{myId=id;hostConn=peer.connect('hayoshi-'+room.toLowerCase(),{reliable:true});setupConn(hostConn);hostConn.on('open',()=>{connected();hostConn.send({type:'hello',name})})});peer.on('error',e=>setStatus(e.type==='peer-unavailable'?'司会者が見つかりません。ルームコードを確認してください':'接続エラー：'+e.type));render()}
$('hostBtn').onclick=startHost;$('joinBtn').onclick=join;$('buzzBtn').onclick=()=>{if(open&&!winnerId)hostConn.send({type:'buzz',at:performance.now()})};$('askBtn').onclick=()=>{const q=$('questionInput').value.trim();if(!q){alert('問題文を入力してください');return}question=q;questionNo++;winnerId=null;open=false;render();setStatus('問題を出しました。早押し開始を押してください');broadcast({type:'question',question,questionNo})};$('openBtn').onclick=()=>{if(!question){alert('先に問題を出してください');return}open=true;winnerId=null;render();setStatus('早押し受付中！');broadcast({type:'open'})};$('lockBtn').onclick=()=>{open=false;render();broadcast({type:'lock'});setStatus('早押しを一時停止しました')};$('nextBtn').onclick=()=>{question='';winnerId=null;open=false;questionNo++;$('questionInput').value='';render();broadcast({type:'next',questionNo});setStatus('次の問題を入力してください')};$('copyBtn').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('room',room);await navigator.clipboard.writeText(url.href);$('roomInput').value=room;setStatus('参加リンクをコピーしました')};$('leaveBtn').onclick=()=>{if(peer)peer.destroy();location.reload()};const q=new URLSearchParams(location.search).get('room');if(q){$('roomInput').value=q.toUpperCase();$('nickname').focus()}
})();
</script></body></html>
